name: JoyReactor and Pawchive CI

on:
  push:
    branches:
      - ci/joyreactor-pawchive
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joyreactor-pawchive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOORUSAMA_USE_FVM: "false"
    steps:
      - name: Check out Booruviewer2
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/chromium \
            /usr/local/share/chrome
          sudo apt-get clean
          df -h /
          available_kb=$(df --output=avail / | tail -n 1 | tr -d ' ')
          if [[ "$available_kb" -lt 10485760 ]]; then
            echo "Less than 10 GiB free; refusing to start an unreliable Android build."
            exit 1
          fi

      - name: Install native build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm xz-utils

      - name: Import integration source and set app identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ci/joyreactor-pawchive-source.part-00 ]]; then
            cat ci/joyreactor-pawchive-source.part-* > /tmp/joyreactor-pawchive.tar.xz.b64
            base64 --decode /tmp/joyreactor-pawchive.tar.xz.b64 > /tmp/joyreactor-pawchive.tar.xz
            xz --test /tmp/joyreactor-pawchive.tar.xz
            tar -tJf /tmp/joyreactor-pawchive.tar.xz
            tar -xJf /tmp/joyreactor-pawchive.tar.xz -C .
          fi

          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          source = path.read_text()
          old = 'applicationId = "com.degenk.boorusama"'
          new = 'applicationId = "com.degenk.boorusama.joyreactor"'
          if new not in source:
              if old not in source:
                  raise SystemExit("Could not find the original Android applicationId.")
              source = source.replace(old, new, 1)
          source = source.replace(
              'resValue("string", "app_name", "Boorusama Dev")',
              'resValue("string", "app_name", "BooruViewer2 Dev")',
          )
          source = source.replace(
              'resValue("string", "app_name", "Boorusama")',
              'resValue("string", "app_name", "BooruViewer2")',
          )
          path.write_text(source)
          PY

          rm -f ci/joyreactor-pawchive-source.part-*
          git add -A -- \
            lib/boorus/joyreactor \
            lib/boorus/pawchive \
            packages/booru_clients/boorus.yaml \
            packages/booru_clients/lib/joyreactor.dart \
            packages/booru_clients/lib/pawchive.dart \
            packages/booru_clients/lib/src/joyreactor \
            packages/booru_clients/lib/src/pawchive \
            packages/booru_clients/test/joyreactor \
            packages/booru_clients/test/pawchive \
            android/app/build.gradle.kts
          git add -u
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'feat: integrate JoyReactor and Pawchive in co-installable BooruViewer2'
            git push
          else
            echo "Integration source and app identity are already committed."
          fi

      - name: Initialize workspace and run code generation
        run: ./init.sh

      - name: Install configured Android SDK packages
        working-directory: packages/boorusama_cli
        run: dart run boorusama_cli:boorusama setup android-sdk --ci

      - name: Run booru_clients tests
        working-directory: packages/booru_clients
        run: flutter test test/

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build co-installable production release APK
        run: ./build.sh release github build apk --ci --allow-dirty --output-dir release-artifacts/joyreactor-pawchive-apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: booruviewer2-joyreactor-pawchive-apk
          path: release-artifacts/joyreactor-pawchive-apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
