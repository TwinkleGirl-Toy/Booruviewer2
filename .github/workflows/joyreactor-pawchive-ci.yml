name: JoyReactor and Pawchive CI

on:
  push:
    branches:
      - ci/joyreactor-pawchive
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joyreactor-pawchive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Booruviewer2
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Apply uploaded JoyReactor and Pawchive sources
        if: hashFiles('ci/joyreactor-pawchive-source.part-00') != ''
        shell: bash
        run: |
          set -euo pipefail
          cat ci/joyreactor-pawchive-source.part-* > "$RUNNER_TEMP/source.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/source.tar.xz.b64" > "$RUNNER_TEMP/source.tar.xz"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C .
          rm -f ci/joyreactor-pawchive-source.part-*
          git add -A -- \
            lib/boorus/joyreactor \
            lib/boorus/pawchive \
            packages/booru_clients/boorus.yaml \
            packages/booru_clients/lib/joyreactor.dart \
            packages/booru_clients/lib/pawchive.dart \
            packages/booru_clients/lib/src/joyreactor \
            packages/booru_clients/lib/src/pawchive \
            packages/booru_clients/test/joyreactor \
            packages/booru_clients/test/pawchive
          git add -u -- ci
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'feat: add native JoyReactor and Pawchive integrations'
            git push
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install application dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install repository CLI dependencies
        working-directory: packages/boorusama_cli
        run: dart pub get --enforce-lockfile

      - name: Generate Booru configuration and registry
        run: ./gen.sh

      - name: Run booru_clients tests
        run: flutter test packages/booru_clients/test/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        working-directory: packages/boorusama_cli
        run: dart run boorusama_cli:boorusama setup android-sdk --ci

      - name: Build production release APK
        run: flutter build apk --release --flavor prod

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: booruviewer2-joyreactor-pawchive-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
